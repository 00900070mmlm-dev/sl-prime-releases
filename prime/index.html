// ── 구UI / 신UI 갈림 (사장님 2026-11-13) — 이 파일에서 가장 먼저 돈다 ─────────────────────────────
// 신UI 는 사용자 관리에서 "신UI"로 둔 사람(user_metadata.ui === 'new')만 — 개발자도 예외 없음. 나머지는 전부 구UI(app/legacy/index.html).
// 로그인 정보는 sessionStorage 의 Supabase 세션에 있다(01-core.js 의 persistSession). 로그인 전에도 구UI(로그인 화면)를 띄우고,
// 구UI 에서 신UI 대상이 로그인하면 legacy/src/08-root.js 가 새로고침한다 → 여기서 신UI 로 갈린다.
// 창을 다른 페이지로 옮기지 않는다: 설치본 main.js 가 index.html 밖으로의 이동을 막기 때문. 대신 구UI 파일을 읽어
// 이 자리에 써 넣고, 이 문서의 나머지(신UI 의 스타일·스크립트)는 <plaintext> 로 삼켜 실행되지 않게 한다.
(function () {
  var who = null;
  try { var raw = sessionStorage.getItem('sb-lfrawudhoppvvwktqbvg-auth-token'); if (raw) who = (JSON.parse(raw).user || {}).user_metadata || {}; } catch (e) {}
  if (who && who.ui === 'new') return;                // 신UI — 지정한 사람만
  try {
    var r = new XMLHttpRequest(); r.open('GET', 'legacy/index.html', false); r.send(null);
    if ((r.status !== 200 && r.status !== 0) || !r.responseText) { sessionStorage.setItem('sl-ui-fallback', '1'); return; }   // 못 읽으면 표시만 해 둔다 — 로그인 후 신UI 대상이 아니면 08-root.js 가 멈춘다(새로고침 되풀이 막기)
    window.SL_LEGACY_UI = true;
    document.write(r.responseText + '<plaintext style="display:none">');
  } catch (e) { try { sessionStorage.setItem('sl-ui-fallback', '1'); } catch (e2) {} }
})();
</script>

<style>
  /* 번들 폰트. 영문 Inter · 한글 Spoqa Han Sans Neo(Noto Sans KR 파생).

  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: block; src: url('vendor/fonts/Inter-Medium.ttf') format('truetype'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: block; src: url('vendor/fonts/Inter-SemiBold.ttf') format('truetype'); }

  @font-face { font-family: 'Spoqa Han Sans Neo'; font-style: normal; font-weight: 500; font-display: block; src: url('vendor/fonts/SpoqaHanSansNeo-Medium.ttf') format('truetype'); }

  /* 주간테스트 표지 전용(선생님 이름·날짜) — 표지 디자인 글꼴. 필요한 글자만 남긴 부분집합(scripts/build-weekly-cover.py) */
  @font-face { font-family: 'Pretendard WT'; font-style: normal; font-weight: 900; font-display: block; src: url('vendor/fonts/Pretendard-Black-sub.ttf') format('truetype'); }
  @font-face { font-family: 'Pretendard WT'; font-style: normal; font-weight: 600; font-display: block; src: url('vendor/fonts/Pretendard-SemiBold-sub.ttf') format('truetype'); }
  html, body { margin: 0; padding: 0; background: #f5f5f7; }
  * { box-sizing: border-box; }
  #root { min-height: 100vh; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.18); border-radius: 8px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.30); background-clip: padding-box; }
  .name-input { font-family: inherit; }
  .name-input:focus { outline: none; }

  /* ===== 모드 탭 스위처: taste 세그먼트(회색 바탕 + 흰 칸 선택, 2026-11-12) =====
     클래스 이름(lg-*)은 예전 리퀴드 글라스 시절 그대로 둔다(04-studio.js 가 쓴다). 유리·그림자·스프링은 걷어냈고
     칸 이동은 TT_EASE 수준의 짧은 이동(.18s, 오버슈트 없음). */
  .lg-track { position: relative; display: flex; padding: 2px; border-radius: 6px; background: #eeeeee; }
  .lg-thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / var(--n, 3)); z-index: 0; pointer-events: none; transition: transform .18s cubic-bezier(.2,0,0,1); }
  .lg-glass { width: 100%; height: 100%; border-radius: 4px; background: #ffffff; }
  .lg-seg {
    position: relative; z-index: 1; flex: 1 1 0; border: none; background: transparent; cursor: pointer;
    padding: 6px 8px; border-radius: 4px; font-family: inherit; font-size: 13px; letter-spacing: -0.1px;
    white-space: nowrap; transition: color .14s cubic-bezier(.2,0,0,1);
  }
  .lg-sm .lg-seg, .lg-seg.lg-sm { font-size: 12.5px; padding: 6px 2px; letter-spacing: -0.3px; }

  /* ===== 애니메이션 체크박스 (체크마크가 그려짐) ===== */
  .cbx {
    flex: none; width: 18px; height: 18px; margin-top: 1px; border-radius: 5px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #ffffff; border: 1px solid #c7c7cc; background: rgba(255,255,255,0.85);
    transition: background 0.35s cubic-bezier(0.4,0,0.2,1), border-color 0.35s cubic-bezier(0.4,0,0.2,1), transform 0.16s cubic-bezier(0.34,1.5,0.5,1);
  }
  .cbx[data-checked="true"] { background: #0066cc; border-color: #0066cc; }
  .cbx svg { width: 12px; height: 12px; display: block; }
  .cbx svg path {
    stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0;
    transition: stroke-dashoffset 0.25s ease, opacity 0.15s ease;
  }
  .cbx[data-checked="true"] svg path {
    stroke-dashoffset: 0; opacity: 1;
    transition: stroke-dashoffset 0.25s ease 0.15s, opacity 0.1s ease 0.15s;
  }
  /* 행(버튼) 호버·클릭 시 체크박스가 살짝 커졌다 눌림 */
  button:hover > .cbx { transform: scale(1.08); }
  button:active > .cbx { transform: scale(0.94); }

  /* ===== 모의고사 번호 칩: 체크박스와 같은 모션 (숫자 pop + 파란 채움) ===== */
  .num-chip {
    flex: none; min-width: 36px; padding: 6px 5px; text-align: center; border-radius: 8px;
    font-size: 13px; font-family: inherit; cursor: pointer; font-weight: 400;
    border: 1px solid #d2d2d7; background: rgba(255,255,255,0.8); color: #1d1d1f;
    transition: background 0.32s cubic-bezier(0.4,0,0.2,1), border-color 0.32s cubic-bezier(0.4,0,0.2,1), color 0.2s ease, transform 0.16s cubic-bezier(0.34,1.5,0.5,1);
  }
  .num-chip[data-sel="true"] { background: #0066cc; border-color: #0066cc; color: #ffffff; font-weight: 600; }
  .num-chip:hover { transform: scale(1.08); }
  .num-chip:active { transform: scale(0.94); }
  .num-chip .num { display: inline-block; }
  .num-chip[data-sel="true"] .num { animation: numPop 0.35s cubic-bezier(0.34,1.5,0.5,1); }
  @keyframes numPop {
    0% { transform: scale(0.5); }
    60% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  /* ===== 학년·연도 칩: 같은 모션 (라벨 pop + 파란 채움 + 스케일) ===== */
  .sel-chip {
    flex: 1; cursor: pointer; border-radius: 9999px; padding: 6px 0; text-align: center;
    font-size: 13px; font-family: inherit; letter-spacing: -0.1px; font-weight: 400;
    border: 1px solid #d2d2d7; background: rgba(255,255,255,0.6); color: #1d1d1f;
    transition: background 0.32s cubic-bezier(0.4,0,0.2,1), border-color 0.32s cubic-bezier(0.4,0,0.2,1), color 0.2s ease, transform 0.18s cubic-bezier(0.34,1.25,0.6,1);
  }
  .sel-chip[data-sel="true"] { background: rgba(0,102,204,0.10); border-color: rgba(0,102,204,0.40); color: #0066cc; font-weight: 600; }
  .sel-chip:hover { transform: scale(1.04); }
  .sel-chip:active { transform: scale(0.95); }
  .sel-chip .lbl { display: inline-block; }
  .sel-chip[data-sel="true"] .lbl { animation: chipPop 0.3s cubic-bezier(0.34,1.25,0.6,1); }
  @keyframes chipPop {
    0% { transform: scale(0.9); }
    55% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  /* ===== 개발중 안내 모달 ===== */
  .wip-backdrop { animation: wipFade 0.18s ease; }
  .wip-card { animation: wipPop 0.24s cubic-bezier(0.34,1.4,0.5,1); }
  @keyframes wipFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes wipPop { 0% { opacity: 0; transform: scale(0.9) translateY(8px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }

  /* ===== 저장 버튼: 평소 원래색 → 호버 시 파란색 + 광택 스윕 + 글로우 + lift ===== */
  .export-btn {
    position: relative; overflow: hidden; border-radius: 9px; padding: 0 16px; height: 36px;
    font-size: 13px; font-weight: 500; font-family: inherit; letter-spacing: -0.1px; cursor: pointer;
    transition: background 0.5s cubic-bezier(0.4,0,0.2,1), color 0.4s ease, border-color 0.5s cubic-bezier(0.4,0,0.2,1), box-shadow 0.7s ease, transform 0.2s cubic-bezier(0.34,1.4,0.5,1);
  }
  .export-btn.secondary { border: 1px solid #d2d2d7; background: rgba(255,255,255,0.7); color: #1d1d1f; }
  /* 광택 스윕 */
  .export-btn::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(120deg, transparent 15%, rgba(255,255,255,0.30) 50%, transparent 85%);
    transform: translateX(-130%);
  }
  .export-btn:hover::before { transform: translateX(130%); transition: transform 1.25s ease; }
  /* 호버: 파란색 + 살짝 떠오름 + 확대 + 은은한 글로우 */
  .export-btn:hover {
    background: var(--hc, #0066cc); border-color: var(--hc, #0066cc); color: #ffffff;
    transform: translateY(-2px) scale(1.03); box-shadow: 0 8px 26px var(--hc-glow, rgba(0,102,204,0.22));
  }
  .export-btn:active { transform: translateY(0) scale(0.96); box-shadow: 0 2px 8px var(--hc-glow, rgba(0,102,204,0.3)); }
  .export-btn > span { position: relative; z-index: 1; }

  /* ===== 전체 선택 토글 스위치: 같은 탄성 모션 ===== */
  .sw-track {
    flex: none; display: inline-block; width: 38px; height: 22px; border-radius: 9999px;
    background: rgba(0,0,0,0.16); position: relative;
    transition: background 0.32s cubic-bezier(0.4,0,0.2,1), transform 0.16s cubic-bezier(0.34,1.5,0.5,1);
  }
  .sw-track[data-on="true"] { background: #0066cc; }
  .sw-knob {
    position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%;
    background: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    transition: left 0.34s cubic-bezier(0.34,1.45,0.5,1);
  }
  .sw-track[data-on="true"] .sw-knob { left: 18px; animation: knobPop 0.36s cubic-bezier(0.34,1.5,0.5,1); }
  button:hover .sw-track { transform: scale(1.08); }
  button:active .sw-track { transform: scale(0.94); }
  @keyframes knobPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }

  /* 권한 미리보기 띠(08-root.js) — 개발자가 다른 그룹/사람으로 보는 중임을 늘 보이게 */
  .tt-viewas { position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:170; display:flex; align-items:center; gap:10px; height:34px; padding:0 6px 0 14px; border-radius:17px;
    background:var(--ink); color:var(--ink-text); font-family: Inter, 'Spoqa Han Sans Neo', 'Malgun Gothic', system-ui, sans-serif; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,0.2); }
  .tt-viewas b { font-weight:700; }
  .tt-viewas button { height:24px; padding:0 10px; border-radius:12px; border:none; background:rgba(255,255,255,0.18); color:inherit; font:inherit; font-size:12px; cursor:pointer; }

  .tt-td .x { flex:none; border:none; background:none; color:var(--muted); cursor:pointer; font-size:15px; line-height:18px; padding:0 2px; opacity:0; transition:opacity .14s cubic-bezier(.2,0,0,1); }
  .tt-td:hover .x { opacity:1; }

  @media (max-width: 1000px) {
    .tt-tile { grid-column:span 6; }

  }

  }

    .tt-mbar { display:flex; position:sticky; top:0; z-index:80; height:48px; align-items:center; justify-content:space-between; padding:0 12px 0 16px; background:var(--ground); border-bottom:1px solid var(--border); }

    .tt-mbar svg { width:22px; height:22px; stroke:currentColor; stroke-width:1.6; fill:none; stroke-linecap:round; }
    .tt-rail { display:none; }
    .tt-rail.open { display:flex; width:100%; height:100%; inset:0; padding:28px 16px; border:none; box-shadow:none; background:var(--surface); z-index:300; animation:ttRailIn .3s ease-in-out; }
    .tt-rail.open .lb { opacity:1; }
    .tt-rail .tt-railx { display:flex; position:absolute; right:20px; top:24px; width:40px; padding:0; justify-content:center; margin:0; }
    @keyframes ttRailIn { from { transform:translateX(-100%); opacity:0; } to { transform:none; opacity:1; } }
    .tt-home { padding:28px 16px 32px; }
    .tt-top { position:static; justify-content:flex-end; padding:12px 16px 0; }
    .tt-grid { margin-top:24px; gap:12px; }
    .tt-tile { height:auto; min-height:104px; }
  }
